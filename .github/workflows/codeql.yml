name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode_app=''
          for candidate in /Applications/Xcode_26*.app; do
            if [ -d "$candidate" ]; then
              xcode_app="$candidate"
              break
            fi
          done
          if [ -z "$xcode_app" ]; then
            printf '%s\n' 'Xcode 26+ is required, but no /Applications/Xcode_26*.app was found.' >&2
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s\n' "$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          printf 'Selected %s\n' "$xcode_app"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build application
        run: |
          scripts/generate-project.sh
          xcodebuild \
            -project MediaControlRelay.xcodeproj \
            -scheme MediaControlRelay \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:swift
