name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Start pull-request time budget
        run: printf 'JOB_STARTED_AT=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          product=true
          if [ "$EVENT_NAME" = pull_request ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
            if [ -n "$changed" ] &&
              ! printf '%s\n' "$changed" | grep -Ev '(\.md$|^docs/)' >/dev/null; then
              product=false
              printf '%s\n' 'Only Markdown or docs/ files changed; skipping build and test steps.'
            fi
          fi
          printf 'product=%s\n' "$product" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26 or later
        if: steps.scope.outputs.product == 'true'
        run: |
          set -euo pipefail
          xcode_app=''
          for candidate in /Applications/Xcode*.app; do
            if [ ! -d "$candidate" ]; then
              continue
            fi
            if ! version="$(
              DEVELOPER_DIR="$candidate/Contents/Developer" \
                xcodebuild -version 2>/dev/null | awk 'NR == 1 { print $2 }'
            )"; then
              continue
            fi
            major_version="${version%%.*}"
            case "$major_version" in
              ''|*[!0-9]*) continue ;;
            esac
            if [ "$major_version" -ge 26 ]; then
              xcode_app="$candidate"
              break
            fi
          done
          if [ -z "$xcode_app" ]; then
            printf '%s\n' 'Xcode 26 or later is required, but no compatible Xcode app was found.' >&2
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s\n' "$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          printf 'Selected %s\n' "$xcode_app"

      - name: Install XcodeGen
        if: steps.scope.outputs.product == 'true'
        run: brew install xcodegen

      - name: Initialize CodeQL
        if: steps.scope.outputs.product == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build application
        if: steps.scope.outputs.product == 'true'
        run: |
          scripts/generate-project.sh
          xcodebuild \
            -project MediaControlRelay.xcodeproj \
            -scheme MediaControlRelay \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL analysis
        if: steps.scope.outputs.product == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:swift
      - name: Report pull-request time budget
        if: always()
        env:
          BUDGET_MINUTES: "25"
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          minutes=$(( elapsed / 60 ))
          seconds=$(( elapsed % 60 ))
          printf 'Job time: %dm %02ds (budget %s minutes)\n' "$minutes" "$seconds" "$BUDGET_MINUTES" |
            tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt $(( BUDGET_MINUTES * 60 )) ]; then
            printf '::warning::Job took %dm %02ds, over the %s-minute pull-request budget\n' \
              "$minutes" "$seconds" "$BUDGET_MINUTES"
          fi
