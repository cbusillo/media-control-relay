name: App Store Release Status

on:
  schedule:
    - cron: "23 */6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-release-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Track public App Store release delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/app-store-release-status.py
