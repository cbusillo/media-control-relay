name: MediaControlRelay

options:
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    macOS: "15.0"
  minimumXcodeGenVersion: "2.40.0"

configs:
  Debug: debug
  Release: release
  AppStore: release

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

targets:
  MediaControlCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MediaControlCore
    settings:
      base:
        PRODUCT_NAME: MediaControlCore
        SKIP_INSTALL: true

  UPnPMediaTarget:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/UPnPMediaTarget
    dependencies:
      - target: MediaControlCore
    settings:
      base:
        PRODUCT_NAME: UPnPMediaTarget
        SKIP_INSTALL: true

  MediaControlRelay:
    type: application
    platform: macOS
    sources:
      - path: Sources/MediaControlRelayApp
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - target: MediaControlCore
      - target: UPnPMediaTarget
    settings:
      base:
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        CODE_SIGN_ENTITLEMENTS: Config/MediaControlRelay.entitlements
        CURRENT_PROJECT_VERSION: "8"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/MediaControlRelay-Info.plist
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.media-control-relay
        PRODUCT_NAME: Media Control Relay
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Config/MediaControlRelayAppStore.entitlements

  MediaControlCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MediaControlCoreTests
    dependencies:
      - target: MediaControlCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.media-control-relay.core-tests

  UPnPMediaTargetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/UPnPMediaTargetTests
    dependencies:
      - target: UPnPMediaTarget
      - target: MediaControlCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.media-control-relay.upnp-tests

  MediaControlRelayAppTests:
    type: bundle.unit-test
    platform: macOS
    hostApplication: MediaControlRelay
    sources:
      - path: Tests/MediaControlRelayAppTests
    dependencies:
      - target: MediaControlRelay
      - target: MediaControlCore
        link: false
      - target: UPnPMediaTarget
        link: false
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shinycomputers.media-control-relay.app-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Media Control Relay.app/Contents/MacOS/Media Control Relay"

schemes:
  MediaControlRelay:
    build:
      targets:
        MediaControlRelay: all
    run:
      config: Debug
    test:
      targets:
        - MediaControlCoreTests
        - UPnPMediaTargetTests
        - MediaControlRelayAppTests
    archive:
      config: AppStore
